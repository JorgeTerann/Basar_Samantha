<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papeleria Samantha - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Papeleria S.</h2>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-btn active" data-module="pos">
          <span class="nav-icon">🛒</span> Punto de Venta
        </button>
        <button class="nav-btn" data-module="copias">
          <span class="nav-icon">📄</span> Copias e Impresiones
        </button>
        <button class="nav-btn" data-module="inventario">
          <span class="nav-icon">📦</span> Inventario
        </button>
      </nav>
      <div class="sidebar-footer">
        <div id="userInfo" class="user-info"></div>
        <button id="btnLogout" class="btn btn-danger btn-sm">Cerrar Sesion</button>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <button id="menuToggle" class="menu-toggle">☰</button>
        <h3 id="moduleTitle">Punto de Venta</h3>
      </header>
      <section id="mod-pos" class="module active">
        <div class="pos-layout">
          <div class="pos-left">
            <div class="search-box">
              <input type="text" id="buscarProducto" placeholder="Buscar por codigo de barras o nombre...">
              <button id="btnAgregarProducto" class="btn btn-primary">Agregar</button>
            </div>
            <div class="table-container">
              <table class="table" id="tablaCarrito">
                <thead>
                  <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Cant.</th>
                    <th>Subtotal</th>
                    <th>Acc.</th>
                  </tr>
                </thead>
                <tbody id="carritoBody"></tbody>
              </table>
            </div>
          </div>
          <div class="pos-right">
            <div class="resumen-venta">
              <h3>Resumen</h3>
              <div class="resumen-item">
                <span>Subtotal:</span>
                <span id="resumenSubtotal">$0.00</span>
              </div>
              <div class="resumen-item total">
                <span>TOTAL:</span>
                <span id="resumenTotal">$0.00</span>
              </div>
              <div class="form-group">
                <label for="metodoPago">Metodo de pago</label>
                <select id="metodoPago" class="form-control">
                  <option value="Efectivo">Efectivo</option>
                  <option value="Tarjeta">Tarjeta</option>
                  <option value="Transferencia">Transferencia</option>
                </select>
              </div>
              <div class="form-group">
                <label for="montoPago">Monto recibido</label>
                <input type="number" id="montoPago" class="form-control" step="0.01" min="0">
              </div>
              <div class="resumen-item">
                <span>Vuelto:</span>
                <span id="resumenVuelto">$0.00</span>
              </div>
              <button id="btnConfirmarVenta" class="btn btn-success btn-full">Confirmar Venta</button>
              <button id="btnImprimirTicket" class="btn btn-secondary btn-full" disabled>Imprimir Ticket</button>
            </div>
          </div>
        </div>
      </section>
      <section id="mod-copias" class="module">
        <div class="copias-container">
          <h2>Copias e Impresiones</h2>
          <div class="copias-form">
            <div class="form-group">
              <label>Tipo de servicio</label>
              <select id="tipoServicio" class="form-control">
                <option value="">Seleccione...</option>
              </select>
            </div>
            <div class="form-group">
              <label for="numPaginas">Numero de paginas</label>
              <input type="number" id="numPaginas" class="form-control" min="1" value="1">
            </div>
            <div class="form-group">
              <label>Tarifa por pagina</label>
              <p id="tarifaPagina" class="tarifa-display">$0.00</p>
            </div>
            <div class="form-group">
              <label>Total a cobrar</label>
              <h2 id="totalCopias" class="total-display">$0.00</h2>
            </div>
            <button id="btnCobrarCopias" class="btn btn-success btn-full">Cobrar</button>
          </div>
        </div>
      </section>
      <section id="mod-inventario" class="module">
        <div class="inventario-header">
          <h2>Control de Inventario</h2>
          <button id="btnNuevoProducto" class="btn btn-primary">+ Nuevo Producto</button>
        </div>
        <div class="search-box">
          <input type="text" id="buscarInventario" placeholder="Buscar producto...">
        </div>
        <div class="table-container">
          <table class="table" id="tablaInventario">
            <thead>
              <tr>
                <th>Codigo</th>
                <th>Nombre</th>
                <th>P. Costo</th>
                <th>P. Venta</th>
                <th>Stock</th>
                <th>Stock Min.</th>
                <th>Categoria</th>
                <th>Acc.</th>
              </tr>
            </thead>
            <tbody id="inventarioBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="productoModal" class="modal">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <h3 id="modalTitle">Nuevo Producto</h3>
      <form id="productoForm">
        <input type="hidden" id="prodId">
        <div class="form-group">
          <label for="prodCodigo">Codigo de barras</label>
          <input type="text" id="prodCodigo" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="prodNombre">Nombre</label>
          <input type="text" id="prodNombre" class="form-control" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="prodPrecioCosto">Precio costo</label>
            <input type="number" id="prodPrecioCosto" class="form-control" step="0.01" required>
          </div>
          <div class="form-group">
            <label for="prodPrecioVenta">Precio venta</label>
            <input type="number" id="prodPrecioVenta" class="form-control" step="0.01" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="prodStockActual">Stock actual</label>
            <input type="number" id="prodStockActual" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="prodStockMinimo">Stock minimo</label>
            <input type="number" id="prodStockMinimo" class="form-control" required>
          </div>
        </div>
        <div class="form-group">
          <label for="prodCategoria">Categoria</label>
          <input type="text" id="prodCategoria" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Guardar</button>
      </form>
    </div>
  </div>

  <div id="ticketModal" class="modal">
    <div class="modal-content modal-ticket">
      <span class="modal-close">&times;</span>
      <h3>Ticket de Venta</h3>
      <div id="ticketContent" class="ticket-content"></div>
      <button id="btnPrintTicket" class="btn btn-primary btn-full">Imprimir</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
